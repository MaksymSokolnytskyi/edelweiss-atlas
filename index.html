<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edelweiss · an atlas of the moving ground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css?v=1115j">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="paper" class="hidden"></div>
  <svg id="frame" class="hidden"></svg>
  <div id="readout" class="hidden"></div>
  <div id="loading" class="hidden"></div>
  <div id="section" class="hidden"></div>
  <div id="score" class="hidden"></div>
  <svg id="notes" class="hidden"></svg>
  <article id="story" class="hidden"></article>
  <aside id="sheet" class="hidden"></aside>
  <div id="cover" class="hidden"></div>
  <div id="gloss" class="hidden" role="tooltip"></div>

  <aside id="panel">
    <header>
      <a href="#" id="to-cover" class="small">☰ Edelweiss</a>
      <h1 id="title">…</h1>
      <div id="subtitle"></div>
      <div id="anchor" class="badge"></div>
      <button id="story-open" class="hidden"></button>
    </header>

    <section>
      <label><span data-i18n="scene">Place</span>
        <select id="scene"></select></label>
      <label class="hidden"><span data-i18n="theme">Style</span>
        <select id="theme"></select></label>
    </section>

    <section id="card" class="hidden"></section>

    <section id="layers"></section>

    <section id="trustbox">
      <div class="row"><span data-i18n="trust">Trust</span>
        <select id="trustmode">
          <option value="fade" data-i18n="trust_fade">weak strokes faded</option>
          <option value="strong" data-i18n="trust_strong">reliable only</option>
          <option value="all" data-i18n="trust_all">all, no trust</option>
        </select></div>
    </section>

    <section id="timebox">
      <div class="row"><button id="play">▶</button><span id="date"></span></div>
      <input id="time" type="range" min="0" max="1" step="1" value="1">
    </section>

    <section id="legend"></section>
    <section id="point" class="hidden"></section>
    <footer id="stats"></footer>
  </aside>

  <script type="module" src="app.js?v=1115j"></script>
</body>
</html>
